# Valide les packages à chaque PR ; sur main, publie le registre sur GitHub Pages.
name: packages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false  # aucune dépendance, donc pas de go.sum à mettre en cache
      - name: Lua 5.4 (vérification de la syntaxe)
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: go test ./...
      - name: Index publié (pour exiger une nouvelle version quand un package change)
        run: curl -fsSL https://bjorand.github.io/termina-packages/index.lua -o prev.lua || rm -f prev.lua
      - name: Validation et génération du site
        run: |
          PREV=""
          if [ -f prev.lua ]; then PREV="-prev prev.lua"; fi
          go run ./tools/mkindex -luac luac5.4 -repo "${{ github.server_url }}/${{ github.repository }}" -out site $PREV
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push'
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
